name: Validate skills

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run skill registry / router consistency checks
        run: bash scripts/validate-skills.sh
      - name: Run eval smoke test (static mode, report only)
        continue-on-error: true
        run: python3 scripts/run-evals.py --mode static
