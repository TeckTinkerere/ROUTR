name: Validate skills

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Run skill registry / router consistency checks
        run: bash scripts/validate-skills.sh
      - name: Run eval runner unit tests (fake claude CLI, no network)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run eval smoke test (static mode, report only)
        continue-on-error: true
        run: python3 scripts/run-evals.py --mode static
